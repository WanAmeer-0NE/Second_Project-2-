<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Video - Animal Encyclopedia</title>
    <link rel = "stylesheet" href = "background.css">
    <link rel = "stylesheet" href = "header.css">
    <link rel = "stylesheet" href = "footer.css">
    <link rel = "stylesheet" href = "video.css">
</head>
<body>
    <!-- Your modular header -->
  <header>
    <h1>🐾 Animal Encyclopedia</h1>
    <div class="header-nav">
      <a href="index.html">🏠 Home</a>
      <a href="encyclopedia.html">🔍 Search Animals</a>
      <a href="video.html" style="background-color: rgba(52, 152, 219, 0.2); border: 1px solid #3498db;">🎥 Watch Videos</a>
      <a href="about.html">👥 Meet the Team</a>
    
    </div>
  </header>

  <main class="video-page">
    
    <!-- The new Search & Filter Controls -->
    <div class = "video-controls">
      <input type = "text" id = "videoSearch" placeholder = "Search videos...">
      
      <select id="videoCategoryFilter">
        <option value = "all">All Categories</option>
        <option value = "Mammal">Mammal</option>
        <option value = "Reptile">Reptile</option>
        <option value = "Bird">Bird</option>
        <option value = "Amphibian">Amphibian</option>
        <option value = "Fish">Fish</option>
      </select>
    </div>

    <!-- The empty container where JavaScript will put the videos -->
    <div class="video-grid" id="videoContainer"></div>

  </main>

  <div id="footer-placeholder"></div>
  <script src="component.js"></script>
  
  <!-- Add this new script tag at the bottom! -->
  <script src="video.js"></script>
</body>
</html>
